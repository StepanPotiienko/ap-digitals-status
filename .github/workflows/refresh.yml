name: Refresh integration status

on:
  schedule:
    - cron: '30 6 * * *'   # daily 06:30 UTC = 09:30 Kyiv (EEST)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Provision service account
        env:
          GADS_SA_JSON: ${{ secrets.GADS_SA_JSON }}
        run: |
          echo "$GADS_SA_JSON" > client.json
        shell: bash
      - name: Run collector
        env:
          GADS_DEV_TOKEN: ${{ secrets.GADS_DEV_TOKEN }}
          GADS_CLIENT_ID: ${{ secrets.GADS_CLIENT_ID }}
          GADS_CLIENT_SECRET: ${{ secrets.GADS_CLIENT_SECRET }}
          GADS_REFRESH_TOKEN: ${{ secrets.GADS_REFRESH_TOKEN }}
          GADS_MANAGER_ID: ${{ secrets.GADS_MANAGER_ID }}
          GADS_CUSTOMER_ID: ${{ secrets.GADS_CUSTOMER_ID }}
        run: python fetch_status.py
