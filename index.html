<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Статус інтеграцій</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #efefef; color: #202124;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
  }
  .card { background: transparent; padding: 0; margin: 0; }
  h1 {
    font-size: 13px; margin: 0 0 8px; font-weight: 600; color: #5f6368;
    text-align: center; text-transform: uppercase; letter-spacing: .4px;
  }
  table { border-collapse: collapse; font-size: 12px; }
  th {
    font-size: 10px; text-transform: uppercase; letter-spacing: .4px;
    color: #5f6368; font-weight: 600; text-align: left;
    padding: 2px 10px 4px 0; border-bottom: 1px solid #dadce0;
  }
  td { padding: 3px 10px 3px 0; border-bottom: 1px solid #f1f3f4; }
  tr:last-child td { border-bottom: none; }
  .item { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 auto; }
  .green  { background: #34a853; }
  .yellow { background: #fbbc04; }
  .red    { background: #ea4335; }
  .none   { background: #dadce0; }
  .name { font-weight: 500; }
  .date { color: #5f6368; white-space: nowrap; }
  .updated { font-size: 10px; color: #9aa0a6; margin-top: 6px; text-align: center; }
</style>
</head>
<body>
<div class="card">
  <h1>Статус інтеграцій</h1>
  <table id="tbl">
    <thead>
      <tr><th>Інтеграція</th><th>Останнє оновлення даних</th></tr>
    </thead>
    <tbody id="rows"><tr><td colspan="2" style="color:#5f6368">Завантаження…</td></tr></tbody>
  </table>
  <div class="updated" id="updated"></div>
</div>
<script>
const SHEET_ID = "1ZrV1gk284yxzwgNLM6ZlwQcLHUVDVL3BunKVZsXfIRQ";
const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=status`;

async function load() {
  try {
    const res = await fetch(CSV_URL, { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const text = await res.text();
    render(parseCSV(text));
  } catch (e) {
    document.getElementById("rows").innerHTML =
      '<tr><td colspan="3" style="color:#c5221f">Не вдалося завантажити статус: ' + e.message + '</td></tr>';
  }
}

function parseCSV(text) {
  const lines = text.split(/\r?\n/).filter(l => l.trim() !== "");
  lines.shift(); // header
  return lines.map(l => {
    const m = l.match(/"([^"]*)","([^"]*)","([^"]*)"/);
    return m ? { platform: m[1], status: m[2], date: m[3] } : null;
  }).filter(Boolean);
}

function render(rows) {
  const el = document.getElementById("rows");
  el.innerHTML = "";
  if (!rows.length) {
    el.innerHTML = '<tr><td colspan="2" style="color:#5f6368">Немає даних</td></tr>';
    return;
  }
  // Keep the integrations in source (=status sheet) order.
  rows.forEach(r => {
    const st = (r.status || "").toLowerCase();
    const color = ["green", "yellow", "red"].includes(st) ? st : "none";
    const hasErr = r.date.startsWith("ERR");
    const dateText = hasErr ? "немає даних" : (r.date || "—");
    const tr = document.createElement("tr");
    tr.innerHTML =
      `<td><span class="item"><span class="dot ${color}"></span><span class="name">${r.platform}</span></span></td>` +
      `<td class="date">${dateText}</td>`;
    el.appendChild(tr);
  });
  const last = rows.map(r => r.date).filter(d => !d.startsWith("ERR")).sort().pop();
  if (last) document.getElementById("updated").textContent = "Оновлено: " + new Date().toLocaleString("uk-UA");
}

load();
// Looker Studio caches the iframe; re-poll the sheet periodically so the
// widget stays fresh without needing a report reload.
setInterval(load, 5 * 60 * 1000);
</script>
</body>
</html>
