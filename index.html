<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Статус інтеграцій</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #EFEFEF; color: #202124;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
  }
  .card {
    background: transparent; padding: 0; margin: 0;
  }
  h1 {
    font-size: 13px; margin: 0 0 8px; font-weight: 600; color: #5f6368;
    text-align: center; text-transform: uppercase; letter-spacing: .4px;
  }
  .list {
    display: flex; flex-wrap: wrap; gap: 14px; align-items: center;
    justify-content: center; padding: 0;
  }
  .item {
    display: flex; align-items: center; gap: 6px;
  }
  .dot {
    width: 12px; height: 12px; border-radius: 50%;
    flex: 0 0 auto; position: relative;
  }
  .dot:hover::after {
    content: attr(data-title);
    position: absolute; left: 18px; top: -5px;
    background: #3c4043; color: #fff; padding: 3px 7px;
    border-radius: 5px; font-size: 11px; white-space: nowrap;
    z-index: 10; box-shadow: 0 1px 4px rgba(0,0,0,.3);
  }
  .name { font-weight: 500; font-size: 12px; }
  .green  { background: #34a853; }
  .yellow { background: #fbbc04; }
  .red    { background: #ea4335; }
  .updated { font-size: 10px; color: #9aa0a6; margin-top: 6px; text-align: center; }
</style>
</head>
<body>
<div class="card">
  <h1>Статус інтеграцій</h1>
  <div class="list" id="rows"><div style="color:#5f6368;font-size:13px">Завантаження…</div></div>
  <div class="updated" id="updated"></div>
</div>
<script>
const SHEET_ID = "1ZrV1gk284yxzwgNLM6ZlwQcLHUVDVL3BunKVZsXfIRQ";
const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=status`;

async function load() {
  try {
    const res = await fetch(CSV_URL, { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const text = await res.text();
    const rows = parseCSV(text);
    render(rows);
  } catch (e) {
    document.getElementById("rows").innerHTML =
      '<div style="color:#c5221f;font-size:13px">Не вдалося завантажити статус: ' + e.message + '</div>';
  }
}

function parseCSV(text) {
  // gviz out:csv returns quoted fields, comma-separated, no headers issue
  const lines = text.split(/\r?\n/).filter(l => l.trim() !== "");
  lines.shift(); // header
  return lines.map(l => {
    const m = l.match(/"([^"]*)","([^"]*)","([^"]*)"/);
    return m ? { platform: m[1], status: m[2], date: m[3] } : null;
  }).filter(Boolean);
}

function render(rows) {
  const el = document.getElementById("rows");
  el.innerHTML = "";
  if (!rows.length) {
    el.innerHTML = '<div style="color:#5f6368;font-size:13px">Немає даних</div>';
    return;
  }
  rows.forEach(r => {
    const color = (r.status || "").toLowerCase();
    const dateText = r.date.startsWith("ERR") ? r.date : ("Дані: " + r.date);
    const item = document.createElement("div");
    item.className = "item";
    item.innerHTML =
      `<span class="dot ${color}" data-title="${r.platform}: ${dateText}"></span>` +
      `<span class="name">${r.platform}</span>`;
    el.appendChild(item);
  });
  const last = rows.map(r => r.date).filter(d => !d.startsWith("ERR")).sort().pop();
  if (last) document.getElementById("updated").textContent = "Оновлено: " + new Date().toLocaleString("uk-UA");
}

load();
// Looker Studio caches the iframe; re-poll the sheet periodically so the
// widget stays fresh without needing a report reload.
setInterval(load, 5 * 60 * 1000);
</script>
</body>
</html>
