<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Статус інтеграцій</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: transparent; color: #202124;
  }
  .card {
    background: #fff; border: 1px solid #dadce0; border-radius: 12px;
    padding: 16px; max-width: 560px; margin: 0 auto;
    box-shadow: 0 1px 3px rgba(60,64,67,.12);
  }
  h1 { font-size: 16px; margin: 0 0 12px; font-weight: 600; }
  .row {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 8px; border-bottom: 1px solid #f1f3f4;
  }
  .row:last-child { border-bottom: none; }
  .dot {
    width: 16px; height: 16px; border-radius: 50%;
    flex: 0 0 auto; position: relative;
  }
  .dot:hover::after {
    content: attr(data-title);
    position: absolute; left: 24px; top: -6px;
    background: #3c4043; color: #fff; padding: 4px 8px;
    border-radius: 6px; font-size: 12px; white-space: nowrap;
    z-index: 10; box-shadow: 0 1px 4px rgba(0,0,0,.3);
  }
  .name { font-weight: 500; font-size: 14px; }
  .badge {
    margin-left: auto; font-size: 11px; font-weight: 600;
    padding: 2px 8px; border-radius: 10px; letter-spacing: .3px;
  }
  .green  { background: #34a853; }
  .yellow { background: #fbbc04; }
  .red    { background: #ea4335; }
  .b-green  { background:#e6f4ea; color:#137333; }
  .b-yellow { background:#fef7e0; color:#b06000; }
  .b-red    { background:#fce8e6; color:#c5221f; }
  .updated { font-size: 11px; color: #5f6368; text-align: center; margin-top: 12px; }
</style>
</head>
<body>
<div class="card">
  <h1>Статус інтеграцій</h1>
  <div id="rows"><div style="color:#5f6368;font-size:13px">Завантаження…</div></div>
  <div class="updated" id="updated"></div>
</div>
<script>
const SHEET_ID = "1ZrV1gk284yxzwgNLM6ZlwQcLHUVDVL3BunKVZsXfIRQ";
const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=status`;
const STALE_LABEL = { "GREEN": "Дані надходять", "YELLOW": "Затримка даних", "RED": "Дані не надходять" };

async function load() {
  try {
    const res = await fetch(CSV_URL, { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const text = await res.text();
    const rows = parseCSV(text);
    render(rows);
  } catch (e) {
    document.getElementById("rows").innerHTML =
      '<div style="color:#c5221f;font-size:13px">Не вдалося завантажити статус: ' + e.message + '</div>';
  }
}

function parseCSV(text) {
  // gviz out:csv returns quoted fields, comma-separated, no headers issue
  const lines = text.split(/\r?\n/).filter(l => l.trim() !== "");
  lines.shift(); // header
  return lines.map(l => {
    const m = l.match(/"([^"]*)","([^"]*)","([^"]*)"/);
    return m ? { platform: m[1], status: m[2], date: m[3] } : null;
  }).filter(Boolean);
}

function render(rows) {
  const el = document.getElementById("rows");
  el.innerHTML = "";
  if (!rows.length) {
    el.innerHTML = '<div style="color:#5f6368;font-size:13px">Немає даних</div>';
    return;
  }
  rows.forEach(r => {
    const color = (r.status || "").toLowerCase();
    const label = STALE_LABEL[r.status] || r.status;
    const dateText = r.date.startsWith("ERR") ? r.date : ("Дані: " + r.date);
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML =
      `<span class="dot ${color}" data-title="${r.platform}: ${dateText}"></span>` +
      `<span class="name">${r.platform}</span>` +
      `<span class="badge b-${color}">${label}</span>`;
    el.appendChild(row);
  });
  const last = rows.map(r => r.date).filter(d => !d.startsWith("ERR")).sort().pop();
  if (last) document.getElementById("updated").textContent = "Оновлено: " + new Date().toLocaleString("uk-UA");
}

load();
</script>
</body>
</html>
